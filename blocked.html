<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Blocked — SafeSearch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="blocked-body">

<div class="blocked-container">

    <div class="blocked-card">
        <div class="shield">🛡️</div>

        <h1>Distraction Blocked!</h1>

        <p class="blocked-desc">
            This page is restricted by your personal SafeSearch focus rules. Take a breath and protect your momentum.
        </p>

        <div class="quote-box">
            <p class="motivation">"Discipline is choosing between what you want now and what you want most." 🚀</p>
        </div>

        <button id="goBack">
            <span>←</span>
            <span>Return to Previous Page</span>
        </button>
    </div>

</div>

<script>
    document.getElementById("goBack").addEventListener("click", () => {
        window.history.back();
    });
</script>

</body>
</html>
